<ion-header [translucent]="true">
  <ion-toolbar>
     <ion-grid>
       <ion-row>
         <ion-col>Total Inventory Count</ion-col>
         <ion-col>Active Student Loans</ion-col>
       </ion-row>
      </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
       <ion-row>
         <ion-col>
            <ion-card>
              <ion-card-header>
                <ion-card-title>{{ totalInventoryCount }}</ion-card-title>
              </ion-card-header>
            </ion-card>
         </ion-col>

          <ion-col>
            <ion-card>
              <ion-card-header>
                 <ion-card-title>{{ activeStudentLoans }}</ion-card-title>
              </ion-card-header>
            </ion-card>
          </ion-col>
       </ion-row>
      </ion-grid>

      <ion-item>
          <ion-input label="Book Title" type="text" [(ngModel)]="title"></ion-input>
      </ion-item>

      <ion-item>
          <ion-input label="Author" type="text" [(ngModel)]="author"></ion-input>
      </ion-item>

      <ion-item>
          <ion-input label="ISBN" type="text" [(ngModel)]="isbn"></ion-input>
      </ion-item>

      <ion-select label="Category" label-placement="floating" multiple="true" [(ngModel)]="category" placeholder="Select Subject">

        <ion-select-option value="fiction">Fiction</ion-select-option>
        <ion-select-option value="non-fiction">Non-Fiction</ion-select-option>
        <ion-select-option value="science">Science</ion-select-option>
        <ion-select-option value="history">History</ion-select-option>
        <ion-select-option value="english">English </ion-select-option>
        <ion-select-option value="maths">Maths</ion-select-option>
        <ion-select-option value="politics">Politics</ion-select-option>
        <ion-select-option value="biography">Biography</ion-select-option>
        <ion-select-option value="autobiography">Autobiography</ion-select-option>

      </ion-select>

      <ion-button expand="block" color="primary" (click)="addNewBook()">Add Book</ion-button>
</ion-content>
