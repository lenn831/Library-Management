<ion-header [translucent]="true">
  <ion-toolbar>
     <ion-grid>
       <ion-row>
         <ion-col>Total Inventory Count</ion-col>
         <ion-col>Active Student Loans</ion-col>
       </ion-row>
      </ion-grid>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
       <ion-card class="stats-card">
        <ion-card-header>
          <ion-card-title>Library Statistics</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <div class="chart" role="img" aria-label="Inventory and active loan statistics">
            <div class="chart-row">
              <span>Total Inventory</span>
              <div class="chart-track">
                <div
                  class="chart-bar inventory-bar"
                  [style.width.%]="inventoryPercentage">
                </div>
              </div>
              <strong>{{ totalInventoryCount }}</strong>
            </div>

            <div class="chart-row">
              <span>Active Loans</span>
              <div class="chart-track">
                <div
                  class="chart-bar loans-bar"
                  [style.width.%]="activeLoanPercentage">
                </div>
              </div>
              <strong>{{ activeStudentLoans }}</strong>
            </div>
          </div>
        </ion-card-content>
        </ion-card>
      </ion-grid>

      <ion-item>
          <ion-input label="Book Title" type="text" [(ngModel)]="title"></ion-input>
      </ion-item>

      <ion-item>
          <ion-input label="Author" type="text" [(ngModel)]="author"></ion-input>
      </ion-item>

      <ion-item>
          <ion-input label="ISBN" type="text" [(ngModel)]="isbn"></ion-input>
      </ion-item>

      <ion-select label="Category" label-placement="floating" [(ngModel)]="category" placeholder="Select Subject">

        <ion-select-option value="fiction">Dystopian</ion-select-option>
        <ion-select-option value="non-fiction">Non-Fiction</ion-select-option>
        <ion-select-option value="science">Science</ion-select-option>
        <ion-select-option value="history">History</ion-select-option>
        <ion-select-option value="english">English </ion-select-option>
        <ion-select-option value="maths">Maths</ion-select-option>
        <ion-select-option value="politics">Politics</ion-select-option>
        <ion-select-option value="biography">Biography</ion-select-option>
        <ion-select-option value="autobiography">Autobiography</ion-select-option>

      </ion-select>

      <ion-button expand="block" color="primary" (click)="addNewBook()">Add Book</ion-button>
</ion-content>
