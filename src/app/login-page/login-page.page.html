<ion-content class="login-page" [fullscreen]="true">
  <main class="login-layout">
    <section class="login-intro">
      <p class="eyebrow">YOUR COMMUNITY LIBRARY</p>
      <h1>Stories start here.</h1>
      <p>Sign in to discover, borrow, and manage your books.</p>
    </section>

    <ion-card class="login-card">
      <ion-card-header>
        <ion-card-title>Welcome back</ion-card-title>
        <ion-card-subtitle>Sign in to your account</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <ion-item class="login-input" lines="none">
            <ion-label position="floating">Username</ion-label>
            <ion-input formControlName="username"></ion-input>
          </ion-item>

          <ion-item class="login-input" lines="none">
            <ion-label position="floating">Password</ion-label>
            <ion-input
              type="password"
              formControlName="password">
            </ion-input>
          </ion-item>

          <ion-button expand="block" type="submit">
            Sign in
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </main>
</ion-content>
